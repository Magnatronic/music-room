<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Drum Pads – Music Room</title>
<link rel="stylesheet" href="framework.css">
</head>
<body>
<script src="framework.js"></script>
<script>
'use strict';
/* ===== ANIMATION START =====
   Drum Pads — big colourful percussion zones. Tap a pad to play its drum; drag
   across pads for rolls. All drums are synthesised (no samples), routed through
   the framework's master chain (volume, effects, auto-mixer, limiter).

   Menu: 🥁 Drums (pad count + backing track) · 🎸 Instrument (effects/volume,
   no Voice — drums are the voice) · ✨ Visuals (press effect etc) · ⭐ Presets.
   Backing track: the therapist loads their own MP3 from disk — nothing bundled,
   still fully offline. Session-only (file permissions can't persist).
*/
const Anim = (() => {

  // Default pad order chosen so few pads = the most useful kit (2 = kick + snare);
  // the therapist can reassign any drum to any pad in the Drums tab.
  const KIT=[
    {key:'kick',   label:'🥁', name:'Kick',    color:[226,28,28]},
    {key:'snare',  label:'🪘', name:'Snare',   color:[245,209,23]},
    {key:'hat',    label:'🎩', name:'Hi-hat',  color:[28,169,169]},
    {key:'clap',   label:'👏', name:'Clap',    color:[245,125,23]},
    {key:'shaker', label:'🪇', name:'Shaker',  color:[59,181,74]},
    {key:'tom',    label:'🛢️', name:'Tom',     color:[125,79,181]},
    {key:'cowbell',label:'🔔', name:'Cowbell', color:[224,90,156]},
    {key:'crash',  label:'💥', name:'Crash',   color:[200,200,210]},
  ];
  const BY_KEY={}; KIT.forEach(d=>BY_KEY[d.key]=d);
  const DEFAULT_PADS=KIT.map(d=>d.key);
  // Per-drum shaping macros (saved in SETTINGS -> presets): every frequency in a
  // recipe scales by pitch, every decay/stop time by len, filter cutoffs by tone.
  function mulOf(key){ return {
    pitch: SETTINGS['tw_'+key+'_pitch']||1,
    len:   SETTINGS['tw_'+key+'_len']||1,
    tone:  SETTINGS['tw_'+key+'_tone']||1 }; }

  let ctx=null, btAudio=null, btName='';

  // ── synthesised drums, routed into the framework master chain ──
  let noiseBuf=null;
  function noiseSrc(ac){
    if(!noiseBuf){
      noiseBuf=ac.createBuffer(1,ac.sampleRate*1.2,ac.sampleRate);
      const d=noiseBuf.getChannelData(0);
      for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
    }
    const s=ac.createBufferSource(); s.buffer=noiseBuf; return s;
  }
  // Every hit counts as a sounding voice so the framework auto-mixer sees it.
  function hit(build){
    const ac=getAudio(); if(!ac||!masterGain) return;
    const t=ac.currentTime+0.012;                 // scheduling headroom
    const out=ac.createGain(); out.gain.value=1; out.connect(masterGain);
    soundingVoices++; updatePolyGain();
    const endAt=build(ac,t,out);                  // returns when the sound is over
    setTimeout(()=>{ soundingVoices=Math.max(0,soundingVoices-1); updatePolyGain();
      try{out.disconnect();}catch(e){} }, Math.max(100,(endAt-ac.currentTime)*1000+150));
  }
  function env(ac,t,peak,decay){ const g=ac.createGain();
    g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(peak,t+0.006);
    g.gain.exponentialRampToValueAtTime(0.0008,t+decay); return g; }
  const DRUMS={
    kick(ac,t,out,m){
      const o=ac.createOscillator(); o.type='sine';
      o.frequency.setValueAtTime(150*m.pitch,t); o.frequency.exponentialRampToValueAtTime(50*m.pitch,t+0.12*m.len);
      const g=env(ac,t,1.1,0.5*m.len); o.connect(g); g.connect(out); o.start(t); o.stop(t+0.65*m.len);
      return t+0.65*m.len;
    },
    snare(ac,t,out,m){
      const n=noiseSrc(ac), bp=ac.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=1800*m.pitch*m.tone; bp.Q.value=0.9;
      const g=env(ac,t,0.8,0.24*m.len); n.connect(bp); bp.connect(g); g.connect(out); n.start(t); n.stop(t+0.32*m.len);
      const o=ac.createOscillator(); o.type='triangle'; o.frequency.value=190*m.pitch;
      const g2=env(ac,t,0.5,0.14*m.len); o.connect(g2); g2.connect(out); o.start(t); o.stop(t+0.2*m.len);
      return t+0.32*m.len;
    },
    hat(ac,t,out,m){
      const n=noiseSrc(ac), hp=ac.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=7500*m.pitch*m.tone;
      const g=env(ac,t,0.45,0.09*m.len); n.connect(hp); hp.connect(g); g.connect(out); n.start(t); n.stop(t+0.16*m.len);
      return t+0.16*m.len;
    },
    clap(ac,t,out,m){
      const n=noiseSrc(ac), bp=ac.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=1500*m.pitch*m.tone; bp.Q.value=1.8;
      const g=ac.createGain(); g.gain.setValueAtTime(0.0001,t);
      for(let i=0;i<3;i++){ const tt=t+i*0.02;                  // three quick bursts
        g.gain.setValueAtTime(0.7,tt); g.gain.exponentialRampToValueAtTime(0.12,tt+0.018); }
      g.gain.exponentialRampToValueAtTime(0.0008,t+0.28*m.len);
      n.connect(bp); bp.connect(g); g.connect(out); n.start(t); n.stop(t+0.36*m.len);
      return t+0.36*m.len;
    },
    shaker(ac,t,out,m){
      const n=noiseSrc(ac), bp=ac.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=5500*m.pitch*m.tone; bp.Q.value=1.4;
      const g=ac.createGain(); g.gain.setValueAtTime(0.0001,t);
      g.gain.linearRampToValueAtTime(0.4,t+0.03); g.gain.exponentialRampToValueAtTime(0.0008,t+0.18*m.len);
      n.connect(bp); bp.connect(g); g.connect(out); n.start(t); n.stop(t+0.25*m.len);
      return t+0.25*m.len;
    },
    tom(ac,t,out,m){
      const o=ac.createOscillator(); o.type='sine';
      o.frequency.setValueAtTime(210*m.pitch,t); o.frequency.exponentialRampToValueAtTime(95*m.pitch,t+0.2*m.len);
      const g=env(ac,t,0.9,0.45*m.len); o.connect(g); g.connect(out); o.start(t); o.stop(t+0.6*m.len);
      return t+0.6*m.len;
    },
    cowbell(ac,t,out,m){
      const bp=ac.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=800*m.pitch*m.tone; bp.Q.value=3;
      const g=env(ac,t,0.5,0.4*m.len); bp.connect(g); g.connect(out);
      for(const f of [540,845]){ const o=ac.createOscillator(); o.type='square';
        o.frequency.value=f*m.pitch; o.connect(bp); o.start(t); o.stop(t+0.55*m.len); }
      return t+0.55*m.len;
    },
    crash(ac,t,out,m){
      const n=noiseSrc(ac), hp=ac.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=5000*m.pitch*m.tone;
      const g=env(ac,t,0.6,1.6*m.len); n.connect(hp); hp.connect(g); g.connect(out); n.start(t); n.stop(t+2.0*m.len);
      return t+2.0*m.len;
    },
  };
  function padKeys(){
    const arr=Array.isArray(SETTINGS.padSounds)?SETTINGS.padSounds:DEFAULT_PADS;
    return arr.slice(0, Math.max(2,Math.min(8,Math.round(SETTINGS.noteCount)||4)));
  }
  function pads(){ return padKeys().map(k=>BY_KEY[k]||KIT[0]); }
  function playDrum(key){ if(DRUMS[key]) hit((ac,t,out)=>DRUMS[key](ac,t,out,mulOf(key))); }
  function playPad(col){ const p=pads()[col]; if(p) playDrum(p.key); }

  // ── backing track: therapist's own file, session-only ──
  function pickTrack(rebuild){
    const inp=document.createElement('input'); inp.type='file'; inp.accept='audio/*';
    inp.addEventListener('change',()=>{
      const f=inp.files&&inp.files[0]; if(!f) return;
      if(btAudio){ btAudio.pause(); URL.revokeObjectURL(btAudio.src); }
      btAudio=new Audio(URL.createObjectURL(f));
      btAudio.loop=true; btAudio.volume=SETTINGS.btVolume;
      btName=f.name; rebuild();
    });
    inp.click();
  }

  // Defaults include every per-drum macro so Reset restores them and presets
  // capture a whole custom kit.
  const DEFAULTS={ theme:'kit', noteCount:4, btVolume:0.7, pressFx:'bloom', tweakDrum:'kick',
    padSounds:DEFAULT_PADS,
    mode:'notes', paint:false, yAxis:'none', zoneLook:'tint', colorMode:'note', showLabels:true };
  KIT.forEach(d=>{ DEFAULTS['tw_'+d.key+'_pitch']=1; DEFAULTS['tw_'+d.key+'_len']=1; DEFAULTS['tw_'+d.key+'_tone']=1; });

  let lastPreview=0;
  function preview(key){                       // throttled so slider drags don't machine-gun
    const now=performance.now();
    if(now-lastPreview<160) return;
    lastPreview=now; getAudio(); playDrum(key);
  }

  return {
    sectionLabel:'Drums',
    lockMode:'notes',
    noVoices:true,                     // drums ARE the sound; skip the pitched voices
    hideRail:['clear'],
    paneLabels:{ instrument:'🥁 Drums' },
    themes:{ kit:{label:'🥁 Kit', colors:[[1,0.2,0.2],[1,0.85,0.1],[0.1,0.7,0.7],[1,0.5,0.1],[0.3,0.75,0.3]]} },
    defaults:DEFAULTS,
    schema:[],
    bandColor(i){ const p=pads()[i]; return p?p.color:[200,200,200]; },
    bandLabel(i){ const p=pads()[i]; return p?p.label:''; },
    // 🥁 Drums tab — pads, pad sounds, backing track
    buildInstrument(el){
      el.appendChild(makeSlider({key:'noteCount',label:'How many pads',min:2,max:8,step:1,dp:0,
        onChange:()=>{ refreshMusic(); buildInstrumentPanel(); }}));
      const hp=document.createElement('div'); hp.className='sectn'; hp.textContent='Pad sounds (tap to change & hear)'; el.appendChild(hp);
      padKeys().forEach((cur,i)=>{
        const row=document.createElement('div'); row.className='chips';
        KIT.forEach(d=>{
          const c=document.createElement('div'); c.className='chip'+(d.key===cur?' active':'');
          c.textContent=d.label; c.title=d.name+(i===0?'':'');
          c.addEventListener('click',e=>{ e.stopPropagation(); getAudio();
            const arr=padKeys(); const full=(Array.isArray(SETTINGS.padSounds)?SETTINGS.padSounds:DEFAULT_PADS).slice();
            full[i]=d.key; SETTINGS.padSounds=full; saveSettings();
            playDrum(d.key); refreshMusic(); buildInstrumentPanel(); });
          row.appendChild(c);
        });
        el.appendChild(row);
      });
      const h=document.createElement('div'); h.className='sectn'; h.textContent='Backing track (from this computer)'; el.appendChild(h);
      const row=document.createElement('div'); row.className='chips';
      const pick=document.createElement('div'); pick.className='chip';
      pick.textContent = btName ? ('🎵 '+(btName.length>26?btName.slice(0,24)+'…':btName)) : '📂 Choose a music file…';
      pick.addEventListener('click',e=>{ e.stopPropagation(); pickTrack(buildInstrumentPanel); });
      row.appendChild(pick);
      if(btAudio){
        const play=document.createElement('div'); play.className='chip'+(btAudio.paused?'':' active');
        play.textContent = btAudio.paused ? '▶ Play' : '⏸ Pause';
        play.addEventListener('click',e=>{ e.stopPropagation(); getAudio();
          if(btAudio.paused) btAudio.play(); else btAudio.pause();
          buildInstrumentPanel(); });
        row.appendChild(play);
      }
      el.appendChild(row);
      if(btAudio) el.appendChild(makeSlider({key:'btVolume',label:'Backing volume',min:0,max:1,step:0.01,dp:2,
        onChange:()=>{ if(btAudio) btAudio.volume=SETTINGS.btVolume; }}));
    },
    // 🎛️ Sound tab — per-drum shaping + effects/volume (no Voice: drums are the voice)
    buildSound(el){
      const hs=document.createElement('div'); hs.className='sectn'; hs.textContent='Shape a drum'; el.appendChild(hs);
      const sel=document.createElement('div'); sel.className='chips';
      KIT.forEach(d=>{
        const c=document.createElement('div'); c.className='chip'+(SETTINGS.tweakDrum===d.key?' active':'');
        c.textContent=d.label+' '+d.name;
        c.addEventListener('click',e=>{ e.stopPropagation(); getAudio();
          SETTINGS.tweakDrum=d.key; saveSettings(); playDrum(d.key); buildSoundPanel(); });
        sel.appendChild(c);
      });
      el.appendChild(sel);
      const k=BY_KEY[SETTINGS.tweakDrum]?SETTINGS.tweakDrum:'kick';
      const hear=()=>preview(k);
      el.appendChild(makeSlider({key:'tw_'+k+'_pitch',label:'Pitch (deep ↔ high)',min:0.5,max:2,step:0.05,dp:2,onChange:hear}));
      el.appendChild(makeSlider({key:'tw_'+k+'_len',  label:'Length (tight ↔ ringing)',min:0.4,max:2.5,step:0.05,dp:2,onChange:hear}));
      el.appendChild(makeSlider({key:'tw_'+k+'_tone', label:'Tone (soft ↔ sharp)',min:0.5,max:2,step:0.05,dp:2,onChange:hear}));
      const rst=document.createElement('div'); rst.className='chips';
      const rc=document.createElement('div'); rc.className='chip'; rc.textContent='↺ Reset this drum';
      rc.addEventListener('click',e=>{ e.stopPropagation(); getAudio();
        SETTINGS['tw_'+k+'_pitch']=1; SETTINGS['tw_'+k+'_len']=1; SETTINGS['tw_'+k+'_tone']=1;
        saveSettings(); playDrum(k); buildSoundPanel(); });
      rst.appendChild(rc); el.appendChild(rst);
      const fx=document.createElement('div'); fx.className='sectn'; fx.textContent='Effects'; el.appendChild(fx);
      el.appendChild(makeToggle('Reverb','reverb',applyReverb));
      el.appendChild(makeToggle('Echo',  'echo',  applyEcho));
      el.appendChild(makeToggle('Mute',  'mute',  applyVolume));
      el.appendChild(makeSlider({key:'volume',label:'Volume',min:0,max:1,step:0.01,dp:2}));
    },
    // ✨ Visuals tab
    buildVisuals(el){
      el.appendChild(makeChips('When a pad is hit','pressFx',PRESSFX_OPTS));
      el.appendChild(makeToggle('Drum icons on pads','showLabels',buildBands));
      const bgRow=document.createElement('div'); bgRow.className='swrow';
      const bgpk=document.createElement('label'); bgpk.className='bbar bgpick'; bgpk.title='Background colour';
      bgpk.textContent='Background colour';
      const bgInp=document.createElement('input'); bgInp.type='color'; bgInp.value=SETTINGS.bg;
      bgInp.addEventListener('input',e=>{ e.stopPropagation(); SETTINGS.bg=bgInp.value; saveSettings(); applyBg(); });
      bgpk.addEventListener('click',e=>e.stopPropagation());
      bgpk.appendChild(bgInp); bgRow.appendChild(bgpk); el.appendChild(bgRow);
      appendFineTune(el);
    },
    onCell(col,row){ playPad(col); fxCell(col,0); },
    init(cv){ ctx=cv.getContext('2d'); this.reset(); refreshMusic(); },
    resize(w,h){ this.reset(); },
    splat(){},
    frame(dt){
      if(!ctx) return;
      ctx.fillStyle='rgb('+(bgRGB[0]*255|0)+','+(bgRGB[1]*255|0)+','+(bgRGB[2]*255|0)+')';
      ctx.fillRect(0,0,canvas.width,canvas.height);
    },
    reset(){
      if(!ctx) return;
      ctx.fillStyle='rgb('+(bgRGB[0]*255|0)+','+(bgRGB[1]*255|0)+','+(bgRGB[2]*255|0)+')';
      ctx.fillRect(0,0,canvas.width,canvas.height);
    },
  };
})();
/* ===== ANIMATION END ===== */

boot();
</script>
</body>
</html>
