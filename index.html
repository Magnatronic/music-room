<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Music Room — Sensory Music Therapy Apps</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{min-height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  color:#fff;background:#0a070c;
  background-image:radial-gradient(circle at 15% 10%,rgba(226,28,28,0.14),transparent 45%),
                   radial-gradient(circle at 85% 25%,rgba(28,169,169,0.16),transparent 45%),
                   radial-gradient(circle at 50% 100%,rgba(125,79,181,0.18),transparent 50%);
  padding:48px 24px 64px;
}
header{max-width:1100px;margin:0 auto 36px;text-align:center}
h1{font-size:clamp(34px,6vw,64px);font-weight:700;letter-spacing:-0.02em;
  background:linear-gradient(90deg,#f5d117,#3bb54a,#1ca9a9,#7d4fb5);
  -webkit-background-clip:text;background-clip:text;color:transparent}
.tag{margin-top:12px;font-size:clamp(14px,2.2vw,18px);color:rgba(255,255,255,0.6);max-width:680px;margin-left:auto;margin-right:auto;line-height:1.5}
.grid{max-width:1100px;margin:0 auto;display:grid;
  grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:18px}
.card{position:relative;display:block;text-decoration:none;color:inherit;
  background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);
  border-radius:18px;padding:22px;min-height:150px;
  transition:transform 0.2s ease,border-color 0.2s ease,background 0.2s ease;overflow:hidden}
.card.live:hover{transform:translateY(-4px);border-color:rgba(255,255,255,0.45);background:rgba(255,255,255,0.09)}
.card .emoji{font-size:34px;line-height:1}
.card h2{font-size:20px;margin:14px 0 6px;font-weight:600}
.card p{font-size:13px;color:rgba(255,255,255,0.55);line-height:1.45}
.card .glow{position:absolute;inset:0;opacity:0;transition:opacity 0.3s;pointer-events:none}
.card.live:hover .glow{opacity:1}
.badge{position:absolute;top:16px;right:16px;font-size:10px;letter-spacing:0.08em;text-transform:uppercase;
  padding:4px 9px;border-radius:20px}
.badge.live{background:rgba(80,220,140,0.18);color:#7dffb0;border:1px solid rgba(80,220,140,0.4)}
.badge.soon{background:rgba(255,255,255,0.06);color:rgba(255,255,255,0.4);border:1px solid rgba(255,255,255,0.12)}
.card.soon{opacity:0.5;cursor:default}
footer{max-width:1100px;margin:48px auto 0;text-align:center;font-size:13px;color:rgba(255,255,255,0.35)}
footer a{color:rgba(255,255,255,0.55)}
</style>
</head>
<body>
<header>
  <h1>Music Room</h1>
  <p class="tag">Accessible music-making apps for the sensory room. Big touchable zones,
     Boomwhacker note colours, per-student presets, and a session lock in every app.
     Works fullscreen on the touch projector and runs entirely offline.</p>
</header>

<main class="grid" id="grid"></main>

<footer>
  Open-source music therapy project ·
  <a href="APPS.md">roadmap</a>
</footer>

<script>
// Each app: file (null = not built yet), emoji, title, blurb, accent colour
const ITEMS = [
  {file:'fluid_sensory.html', emoji:'🎹', title:'Fluid Keys',      blurb:'Paint with sound — a fluid canvas that is also a playable instrument with note zones and octave grid.', accent:'#7ad7ff'},
  {file:'song_grid.html', emoji:'🎵', title:'Song Grid', blurb:'Cells light up to guide a student through real songs, one note at a time, at their own pace.', accent:'#f5d117'},
  {file:'drums.html', emoji:'🥁', title:'Drum Pads',       blurb:'Big colourful percussion zones — kick, snare, shaker — plus a backing track to play along with.', accent:'#e2641c'},
  {file:'big_switch.html', emoji:'🔘', title:'Big Switch Songs',blurb:'The whole screen is one giant button. Every press plays the next part of the song.', accent:'#3bb54a'},
  {file:'echo_bird.html', emoji:'🦜', title:'Echo Bird',     blurb:'The bird plays a little tune, then waits for your reply — every answer makes it happy.', accent:'#7dffb0'},
  {file:'sweep_chimes.html', emoji:'🎐', title:'Sweep Chimes',  blurb:'Sweep through hanging chime bars — they swing, knock together and ring in your scale.', accent:'#8fd3ff'},
  {file:'bubbles.html', emoji:'🫧', title:'Music Bubbles',  blurb:'Pop drifting note bubbles — or follow a song bubble by bubble. Gentle goals, never a fail.', accent:'#9ee7ff'},
  {file:'beat_builder.html', emoji:'🏗️', title:'Beat Builder',   blurb:'Place sounds on big steps and the loop plays forever — save each student\'s beat for next week.', accent:'#ffb36b'},
  {file:'conductor.html', emoji:'🪄', title:'Conductor',      blurb:'The music plays only while you move — speed sets the tempo, height sets the volume.', accent:'#e8c8ff'},
  {file:'strummer.html', emoji:'🎸', title:'Chord Strummer',  blurb:'Sweep across the strings to strum — big chord buttons keep every sweep in harmony.', accent:'#e05a9c'},
  {file:'voice_visuals.html', emoji:'🎤', title:'Voice Visuals',   blurb:'Sing, hum or shout — the microphone turns every sound into light and colour.', accent:'#8affd0'},
  {file:'sampler.html', emoji:'📼', title:'Sampler Pads',    blurb:'Record any sound onto a pad — your voice, a shaker, a door — then play it like an instrument.', accent:'#c0a0ff'},
  {file:'soundscape.html', emoji:'🌧️', title:'Soundscape',      blurb:'Layer rain, waves, birds and soft chords into a calming soundscape with a touch.', accent:'#1ca9a9'},
];

const grid = document.getElementById('grid');
for (const it of ITEMS) {
  const live = !!it.file;
  const el = document.createElement(live ? 'a' : 'div');
  el.className = 'card ' + (live ? 'live' : 'soon');
  if (live) el.href = it.file;
  el.innerHTML = `
    <div class="glow" style="background:radial-gradient(circle at 50% 0%, ${it.accent}33, transparent 70%)"></div>
    <span class="badge ${live?'live':'soon'}">${live?'Live':'Soon'}</span>
    <div class="emoji">${it.emoji}</div>
    <h2>${it.title}</h2>
    <p>${it.blurb}</p>`;
  grid.appendChild(el);
}
</script>
</body>
</html>
