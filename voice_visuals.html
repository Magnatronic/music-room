<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Voice Visuals – Music Room</title>
<link rel="stylesheet" href="framework.css">
<style>
/* Mic gate — the one thing that must be tapped before anything works */
#vvGate{position:fixed;inset:0;display:flex;flex-direction:column;gap:14px;
  align-items:center;justify-content:center;z-index:5;pointer-events:none}
#vvGate.hidden{display:none}
#vvGate button{pointer-events:auto;font-family:sans-serif;font-size:clamp(18px,3.2vh,26px);
  font-weight:700;color:#fff;background:rgba(0,0,0,0.55);border:2px solid rgba(255,255,255,0.45);
  border-radius:26px;padding:20px 34px;cursor:pointer;backdrop-filter:blur(8px);
  -webkit-tap-highlight-color:transparent;touch-action:manipulation;
  text-shadow:0 1px 4px rgba(0,0,0,0.8);transition:transform 0.15s,border-color 0.2s}
#vvGate button:hover{border-color:#fff;transform:scale(1.04)}
#vvGate .msg{pointer-events:none;font:15px sans-serif;color:rgba(255,255,255,0.75);
  background:rgba(0,0,0,0.5);padding:8px 16px;border-radius:14px;max-width:70vw;text-align:center}
/* Live level meter in the Voice tab */
#vvMeter{height:12px;background:rgba(255,255,255,0.12);border-radius:6px;overflow:hidden;margin:6px 0 14px}
#vvMeterFill{height:100%;width:0;background:linear-gradient(90deg,#3bb54a,#f5d117,#e2641c);transition:width 0.12s}
</style>
</head>
<body>
<script src="framework.js"></script>
<script>
'use strict';
/* ===== ANIMATION START =====
   Voice Visuals — vocalize and the room responds with light. Loudness = size
   and brightness, pitch = height and colour. Rewards vocalization for
   non-verbal students; "whisper" sensitivity makes tiny sounds huge.

   Visual design (see fx research notes in git history): frequency → colour,
   amplitude → size/brightness, feedback immediate (the cause-effect loop IS
   the therapy). Each mode has a calm slow baseline that the voice energises,
   sensory-room style. Colour comes from a palette THEME (Prism etc.), from
   Boomwhacker note colours, or a single locked colour.

   LISTEN-ONLY by design: the microphone signal is analysed and never routed
   to the speakers, so feedback is impossible. The framework audio chain is
   created (a user gesture unlocks the context) but nothing is played.

   Pitch via autocorrelation on the time-domain buffer (fine for voice);
   a light 10 Hz poll keeps running while the render loop sleeps so the
   first sound after a silence wakes the visuals instantly. The render loop
   keeps a ~20 s tail after the last sound so decays/twinkles wind down,
   then the sim sleeps (last frame stays on screen).
*/
const Anim = (() => {

  const BW={0:[226,28,28],2:[245,125,23],4:[245,209,23],5:[59,181,74],7:[28,169,169],9:[125,79,181],11:[224,90,156]};
  function bwOf(pc){ if(BW[pc]) return BW[pc];
    const b=BW[(pc+11)%12]||[200,200,200]; return b.map(v=>Math.round(v*0.7)); }

  // Palette themes: pitch (or band index / position) sweeps across the list.
  const THEMES={
    prism: {label:'🌈 Prism',  colors:[[255,40,70],[255,140,0],[255,225,40],[60,255,140],[40,160,255],[170,70,255]]},
    ocean: {label:'🌊 Ocean',  colors:[[0,70,160],[0,150,205],[60,215,220],[130,255,205],[220,255,245]]},
    sunset:{label:'🌅 Sunset', colors:[[90,0,130],[205,45,105],[255,105,60],[255,185,65],[255,240,170]]},
    aurora:{label:'✨ Aurora', colors:[[0,230,150],[0,190,210],[110,130,255],[190,90,255],[120,255,200]]},
    candy: {label:'🍬 Candy',  colors:[[255,90,160],[255,170,220],[170,130,255],[130,220,255],[255,225,240]]},
  };
  function palAt(x){
    const cols=(THEMES[SETTINGS.theme]||THEMES.prism).colors;
    const f=Math.max(0,Math.min(0.999,x))*(cols.length-1);
    const i=f|0, u=f-i, a=cols[i], b=cols[i+1]||a;
    return [a[0]+(b[0]-a[0])*u, a[1]+(b[1]-a[1])*u, a[2]+(b[2]-a[2])*u];
  }
  function mix(a,b,u){ return [a[0]+(b[0]-a[0])*u, a[1]+(b[1]-a[1])*u, a[2]+(b[2]-a[2])*u]; }
  function rgba(c,a){ return 'rgba('+(c[0]|0)+','+(c[1]|0)+','+(c[2]|0)+','+Math.max(0,a).toFixed(3)+')'; }

  const SENS={ whisper:{label:'🤫 Whisper',mul:60}, talk:{label:'🙂 Talking',mul:18}, sing:{label:'📣 Singing',mul:6} };
  const VISMODES={ mandala:{label:'💠 Mandala'},
                   lava:{label:'🫧 Lava'}, waves:{label:'〰️ Waves'},
                   flow:{label:'🌀 Flow'}, pixels:{label:'🟩 Pixels'},
                   leds:{label:'💡 LEDs'},
                   ripples:{label:'💧 Ripples'}, fountain:{label:'🎆 Fireworks'},
                   stars:{label:'⭐ Starfield'} };
  const GATE=0.05;

  let ctx=null, t=0, lastActive=-99;
  let micState='off';               // off | starting | on | denied | error
  let micStream=null, analyser=null, pollId=null, pollCount=0;
  const ABUF=new Float32Array(2048);
  let FBUF=null, bands=null;
  let level=0, meterLvl=0, pitch01=0.4, tp01=0.4, prevLevel=0, lastBurst=-9;
  let noteCol=[120,200,255];                  // last Boomwhacker colour from pitch
  let col=[120,200,255], tcol=[120,200,255];  // smoothed + target display colour
  let lastPitchAt=0, rot=0;
  let rings=[], parts=[], touchRings=[], shoots=[], stars=[], blobs=[];
  let rippleTimer=0, emitAcc=0, wave=null, wave2=null;
  let glowPatches=[], memStars=[], haze=[];
  let flows=[];                              // Flow field particles
  let pix=null, ledPulses=[], ledChase=0;    // Pixels grid; LED strip pulses
  let lastTouchAct=0;                        // rate-limit for discrete touch spawns

  // ── microphone ──
  function micOn(){ return micState==='on'; }
  function rawLevel(){
    if(!analyser) return 0;
    analyser.getFloatTimeDomainData(ABUF);
    let s=0; for(let i=0;i<ABUF.length;i++) s+=ABUF[i]*ABUF[i];
    const rms=Math.sqrt(s/ABUF.length);
    const mul=(SENS[SETTINGS.sensitivity]||SENS.talk).mul*(SETTINGS.boost||1);
    return Math.min(1,rms*mul);
  }
  function enableMic(){
    if(micState==='starting'||micOn()) return;
    micState='starting'; updateMicUI();
    const ac=getAudio();   // user gesture unlocks the context; output stays silent
    navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}})
      .then(stream=>{
        micStream=stream;
        const src=ac.createMediaStreamSource(stream);
        analyser=ac.createAnalyser(); analyser.fftSize=2048;
        src.connect(analyser);        // analyser only — NEVER connected to the output
        const tr=stream.getAudioTracks()[0];
        if(tr) tr.onended=()=>{ disableMic(); micState='error'; updateMicUI(); };
        micState='on'; pokeSim(); updateMicUI();
        // sim-sleep-proof wake: poll level cheaply, poke the loop when there's sound
        pollId=setInterval(()=>{
          pollCount++;
          const r=rawLevel();
          if(r>GATE) pokeSim();
          // peak-hold with a gentle fall, fed by the frame-smoothed level too so the
          // meter shows exactly what the visuals respond to (10 Hz snapshots alone
          // miss short sounds between ticks)
          meterLvl=Math.max(Math.min(1,r),level,meterLvl*0.82);
          const f=document.getElementById('vvMeterFill');
          if(f) f.style.width=Math.round(meterLvl*100)+'%';
        },100);
      })
      .catch(()=>{ micState='denied'; updateMicUI(); });
  }
  function disableMic(){
    if(pollId){ clearInterval(pollId); pollId=null; }
    if(micStream){ micStream.getTracks().forEach(tr=>{ tr.onended=null; tr.stop(); }); micStream=null; }
    analyser=null; level=0; micState='off'; updateMicUI();
  }
  function updateMicUI(){
    const gate=document.getElementById('vvGate'); if(!gate) return;
    gate.classList.toggle('hidden',micOn());
    const btn=gate.querySelector('button'), msg=gate.querySelector('.msg');
    if(micState==='starting'){ btn.textContent='🎤 Starting…'; msg.textContent=''; }
    else if(micState==='denied'){ btn.textContent='🎤 Try again';
      msg.textContent='The microphone was blocked — allow it in the browser, then tap again.'; }
    else if(micState==='error'){ btn.textContent='🎤 Tap to restart the microphone';
      msg.textContent='The microphone stopped (unplugged?).'; }
    else { btn.textContent='🎤 Tap to turn on the microphone';
      msg.textContent='Nothing is ever played out loud — this app only listens.'; }
    refreshRailButtons();
    if(currentQuickMode==='instrument') buildInstrumentPanel();
  }

  // ── analysis: smoothed level + autocorrelation pitch → height/colour ──
  function voiceTargetCol(){
    if(SETTINGS.colorMode==='single'&&SETTINGS.lockedColor)
      return SETTINGS.lockedColor.map(v=>Math.min(1,v)*255);
    if(SETTINGS.colorMode==='note') return noteCol;
    return palAt(tp01);
  }
  function analyse(dt){
    if(!analyser){ level=Math.max(0,level-dt); }
    else{
      const raw=rawLevel();
      const target=raw>GATE?(raw-GATE)/(1-GATE):0;
      const k=1-Math.exp(-dt/(target>level?0.05:0.35));   // fast attack, slow release
      level+=(target-level)*k;
      const now=performance.now();
      if(target>0.02 && now-lastPitchAt>50){ lastPitchAt=now; detectPitch(); }
    }
    tcol=voiceTargetCol();
    const ck=1-Math.exp(-dt/0.15);
    pitch01+=(tp01-pitch01)*ck;
    for(let i=0;i<3;i++) col[i]+=(tcol[i]-col[i])*ck;
  }
  function detectPitch(){
    const sr=audioCtx.sampleRate;
    const minLag=Math.max(2,Math.floor(sr/600)), maxLag=Math.min(1000,Math.floor(sr/75));
    let e=1e-9; for(let i=0;i<1024;i+=2) e+=ABUF[i]*ABUF[i];
    let best=0,bl=0;
    for(let lag=minLag;lag<=maxLag;lag++){
      let c=0;
      for(let i=0;i<1024;i+=2) c+=ABUF[i]*ABUF[i+lag];
      if(c>best){ best=c; bl=lag; }
    }
    if(bl>0 && best/e>0.3){         // voiced enough to trust
      const f=sr/bl;
      tp01=Math.max(0,Math.min(1,Math.log2(f/80)/Math.log2(800/80)));
      const midi=Math.round(69+12*Math.log2(f/440));
      noteCol=bwOf(((midi%12)+12)%12);
    }
  }
  // Log-spaced FFT bands with fast attack / slow release (Mandala).
  function updateBands(n,dt){
    if(!bands||bands.length!==n) bands=new Float32Array(n);
    if(!analyser){ for(let i=0;i<n;i++) bands[i]*=Math.pow(0.05,dt); return; }
    if(!FBUF||FBUF.length!==analyser.frequencyBinCount) FBUF=new Uint8Array(analyser.frequencyBinCount);
    analyser.getByteFrequencyData(FBUF);
    const nyq=audioCtx.sampleRate/2, T=FBUF.length, fmin=90, fmax=6500;
    for(let i=0;i<n;i++){
      const f0=fmin*Math.pow(fmax/fmin,i/n), f1=fmin*Math.pow(fmax/fmin,(i+1)/n);
      let a=(f0/nyq*T)|0, b=Math.max(a+1,Math.ceil(f1/nyq*T));
      let m=0; for(let k=a;k<b&&k<T;k++) if(FBUF[k]>m) m=FBUF[k];
      const v=Math.max(0,m/255-0.14)/0.86;
      const k2=1-Math.exp(-dt/(v>bands[i]?0.03:0.22));
      bands[i]+=(v-bands[i])*k2;
    }
  }
  // Onset = sharp level attack; drives Fireworks bursts and shooting stars.
  function onset(){
    const hit=level-prevLevel>0.10 && level>0.16 && t-lastBurst>0.3;
    if(hit) lastBurst=t;
    return hit;
  }

  function voiceY(H){ return H*(0.8-0.6*pitch01); }
  function vI(){ return SETTINGS.visIntensity||1; }
  // Per-style fine-tuning: each mode exposes 2-3 multipliers (default 1 = the
  // shipped look). Stored in SETTINGS.tw[mode][param] so they persist per
  // device and are captured by ⭐ Presets — per-student tuning for therapists.
  // Optional 5th element: formatter turning the multiplier into a friendly value
  // ("6" ribbons instead of "×1.50"); optional 6th: slider step.
  const TWEAKS={
    mandala:[['detail','Detail (bars)',0.5,1.5],['reach','Reach',0.5,1.6],['bass','Bass glow',0,2]],
    lava:   [['count','Blobs',0.4,1.8],['size','Size',0.5,2]],
    waves:  [['height','Height',0.4,1.8],['thick','Thickness',0.4,2.2],['memory','Memory layer',0,2]],
    flow:   [['density','Density',0.2,1.5],['speed','Speed',0.3,2],['length','Trail length',0.4,2]],
    pixels: [['px','Pixels across',0.27,2.4,v=>''+Math.max(8,Math.round(30*v)),0.01],
             ['spread','Bloom spread',0.4,2],['linger','Afterglow',0.3,2.5]],
    leds:   [['size','LED size',0.7,1.6],['chase','Chase speed',0,2.5],['eq','Equalizer height',0.4,1.5]],
    ripples:[['rate','Wave rate',0.4,2.5],['speed','Wave speed',0.4,2],['thick','Wave thickness',0.4,2.5]],
    fountain:[['embers','Embers',0,2],['burst','Burst size',0.4,2],['fall','Fall speed',0.3,2]],
    stars:  [['count','Stars',0.4,2],['twinkle','Twinkle',0.2,2],['band','Voice band',0.4,2]],
  };
  function tw(p){
    const o=SETTINGS.tw&&SETTINGS.tw[SETTINGS.visMode];
    const v=o?o[p]:null; return v==null?1:v;
  }
  // Scene build-up: how much the screen accumulates (therapist setting) —
  // caps on afterglow / memory stars.
  function buCap(offV,gentleV,fullV){
    const b=SETTINGS.buildup||'full';
    return b==='off'?offV:b==='gentle'?gentleV:fullV;
  }
  function glowDisc(x,y,R,c,a){
    if(a<=0.002||R<=0) return;
    const g=ctx.createRadialGradient(x,y,0,x,y,R);
    g.addColorStop(0,rgba(c,a)); g.addColorStop(0.6,rgba(c,a*0.45)); g.addColorStop(1,rgba(c,0));
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(x,y,R,0,Math.PI*2); ctx.fill();
  }

  // ── 💠 Mandala: three layers — bass glow washing the whole screen, the main
  //    mirrored spectrum ring, and a counter-rotating outer ring of highs ──
  function drawMandala(W,H,dt){
    const q=activeQuality(), base=q==='high'?56:q==='med'?40:28;
    const N=Math.max(16,Math.min(72,Math.round(base*tw('detail')/4)*4));
    updateBands(N,dt);
    rot+=dt*(0.06+level*0.4);
    const cx=W/2, cy=H/2, m=Math.min(W,H);
    const R0=m*0.13*(1+0.18*level), Rmax=m*0.30*tw('reach');
    // LAYER 1: bass fills the room — a huge slow glow behind everything
    let bass=0; if(bands){ const nb=Math.max(2,N/6|0); for(let i=0;i<nb;i++) bass+=bands[i]; bass/=nb; }
    glowDisc(cx,cy,m*0.62,SETTINGS.colorMode==='theme'?palAt(0.06):col,vI()*tw('bass')*(0.02+0.12*bass));
    // breathing centre
    glowDisc(cx,cy,R0*1.5,col,vI()*(0.05+0.30*level));
    // base ring so the mandala exists even in silence
    ctx.strokeStyle=rgba(col,vI()*(0.10+0.15*level)); ctx.lineWidth=Math.max(1.5,m*0.004);
    ctx.beginPath(); ctx.arc(cx,cy,R0,0,Math.PI*2); ctx.stroke();
    ctx.lineCap='round';
    // LAYER 2: main mirrored spectrum
    const bw=2*Math.PI*R0/N*0.42;
    for(let i=0;i<N;i++){
      const v=bands?bands[i]:0; if(v<0.03) continue;
      const c=SETTINGS.colorMode==='theme'?palAt(i/(N-1)):mix(col,[255,255,255],v*0.4);
      const len=Math.pow(v,1.5)*Rmax+bw*0.5;
      const ang=rot+i/N*Math.PI*2;
      ctx.strokeStyle=rgba(c,vI()*(0.18+0.65*v));
      ctx.lineWidth=bw*(0.55+0.65*v);
      for(const s of [1,-1]){   // vertical mirror → kaleidoscope symmetry
        const ca=Math.cos(ang)*s, sa=Math.sin(ang);
        ctx.beginPath();
        ctx.moveTo(cx+ca*R0,cy+sa*R0);
        ctx.lineTo(cx+ca*(R0+len),cy+sa*(R0+len));
        ctx.stroke();
      }
    }
    // LAYER 3: outer ring of the high bands, counter-rotating, reaching the edges
    const Ro=m*0.40;
    for(let i=N>>1;i<N;i++){
      const v=bands?bands[i]:0; if(v<0.05) continue;
      const c=SETTINGS.colorMode==='theme'?palAt(i/(N-1)):mix(col,[255,255,255],0.5);
      const len=(Math.pow(v,1.5)*m*0.16+bw*0.3)*tw('reach');
      const ang=-rot*1.4+(i-(N>>1))/(N>>1)*Math.PI*2;
      ctx.strokeStyle=rgba(c,vI()*(0.10+0.40*v));
      ctx.lineWidth=bw*0.4;
      for(const s of [1,-1]){
        const ca=Math.cos(ang)*s, sa=Math.sin(ang);
        ctx.beginPath();
        ctx.moveTo(cx+ca*Ro,cy+sa*Ro);
        ctx.lineTo(cx+ca*(Ro+len),cy+sa*(Ro+len));
        ctx.stroke();
      }
    }
  }

  // ── 🫧 Lava: drifting glow blobs, each swelling with its own frequency band —
  //    the software lava lamp (grew out of the soundpanel prototype) ──
  function buildBlobs(W,H){
    const q=activeQuality();
    const n=Math.max(3,Math.round((q==='high'?16:q==='med'?11:8)*tw('count')));
    const m=Math.min(W,H);
    blobs=[];
    for(let i=0;i<n;i++){
      const big=i<n*0.4;   // depth: big slow background blobs behind small lively ones
      blobs.push({big,x:Math.random()*W,y:Math.random()*H,
        vx:(Math.random()-0.5)*m*(big?0.02:0.05),vy:(Math.random()-0.5)*m*(big?0.02:0.05),
        r:(big?0.13:0.05)+Math.random()*(big?0.07:0.04),
        ph:Math.random()*Math.PI*2,sp:(big?0.08:0.15)+Math.random()*(big?0.2:0.45)});
    }
  }
  function drawLava(W,H,dt){
    const q=activeQuality();
    const want=Math.max(3,Math.round((q==='high'?16:q==='med'?11:8)*tw('count')));
    if(blobs.length!==want) buildBlobs(W,H);
    updateBands(blobs.length,dt);
    const m=Math.min(W,H);
    // source-over, not additive: each blob blends between the backdrop and
    // its own colour, so nothing can ever exceed the palette colour itself.
    // 'lighter' (and even 'screen', over accumulating frames) pushed every
    // channel toward the ceiling and pale colours drowned the scene in white.
    ctx.globalCompositeOperation='source-over';
    for(let i=0;i<blobs.length;i++){
      const b=blobs[i], v=Math.min(1,(bands?bands[i]:0)+(b.hot||0)), slow=b.big?0.45:1;
      b.hot=Math.max(0,(b.hot||0)-dt*1.5);
      b.vx+=Math.sin(t*b.sp+b.ph)*m*0.05*dt*slow;
      b.vy+=Math.cos(t*b.sp*0.9+b.ph*1.7)*m*0.05*dt*slow;
      b.vx*=Math.pow(0.5,dt); b.vy*=Math.pow(0.5,dt);
      b.x+=b.vx*dt*(1+level*1.5); b.y+=b.vy*dt*(1+level*1.5);
      const R=m*b.r*tw('size')*(0.8+0.2*Math.sin(t*0.5+b.ph))*(1+(b.big?0.7:1.3)*v+0.5*level);
      if(b.x<-R) b.x=W+R; else if(b.x>W+R) b.x=-R;   // wrap softly
      if(b.y<-R) b.y=H+R; else if(b.y>H+R) b.y=-R;
      const c=SETTINGS.colorMode==='theme'
        ?palAt(i/(blobs.length-1))
        :mix(col,[255,255,255],(i%4)*0.06);
      const a=Math.min(0.85,vI()*(b.big?0.6:1)*(0.09+0.10*level+0.38*v));
      glowDisc(b.x,b.y,R,c,a);
    }
    ctx.globalCompositeOperation='lighter';   // restore for touch rings
  }

  // ── 〰️ Waves: the actual shape of the sound — smoothed oscilloscope trace
  //    with a soft/bright double stroke (soundpanel's waveform, rebuilt) ──
  function drawWaves(W,H,dt){
    if(level<=0.004) return;
    const N=110;
    if(!wave||wave.length!==N){ wave=new Float32Array(N); wave2=new Float32Array(N); }
    const step=(ABUF.length/N)|0, k=1-Math.exp(-dt/0.06), k2=1-Math.exp(-dt/0.5);
    for(let i=0;i<N;i++){
      let s=0,c=0;
      for(let j=0;j<step;j+=4){ s+=ABUF[i*step+j]; c++; }
      wave[i]+=(s/c-wave[i])*k;
      wave2[i]+=(wave[i]-wave2[i])*k2;   // slow "memory" envelope
    }
    const mul=(SENS[SETTINGS.sensitivity]||SENS.talk).mul*(SETTINGS.boost||1);
    const cy=H/2;
    const grad=ctx.createLinearGradient(0,0,W,0);
    if(SETTINGS.colorMode==='theme'){
      for(let s=0;s<=4;s++) grad.addColorStop(s/4,rgba(palAt(s/4),1));
    } else {
      grad.addColorStop(0,rgba(mix(col,[255,255,255],0.3),1));
      grad.addColorStop(0.5,rgba(col,1));
      grad.addColorStop(1,rgba(mix(col,[255,255,255],0.3),1));
    }
    const trace=(buf,amp,flip)=>{
      ctx.beginPath();
      for(let i=0;i<N;i++){
        const x=i/(N-1)*W;
        const y=cy+(flip?-1:1)*Math.max(-1,Math.min(1,buf[i]*mul))*amp;
        if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
      }
      ctx.stroke();
    };
    ctx.lineJoin='round'; ctx.lineCap='round';
    ctx.strokeStyle=grad;
    const hh=tw('height'), th=tw('thick');
    // LAYER 1: the slow memory of the last phrase, huge and soft, filling the screen
    ctx.globalAlpha=vI()*tw('memory')*(0.05+0.10*level); ctx.lineWidth=Math.max(10,H*0.05)*th;
    trace(wave2,H*0.44*hh,false);
    // LAYER 2: mirrored ghost — symmetric, sculptural
    ctx.globalAlpha=vI()*(0.10+0.16*level); ctx.lineWidth=Math.max(2.5,H*0.007)*th;
    trace(wave,H*0.30*hh,true);
    // LAYER 3: the live trace, halo + body + bright core
    ctx.globalAlpha=vI()*(0.10+0.18*level); ctx.lineWidth=Math.max(6,H*0.022)*th; trace(wave,H*0.30*hh,false);
    ctx.globalAlpha=vI()*(0.25+0.45*level); ctx.lineWidth=Math.max(2.5,H*0.007)*th; trace(wave,H*0.30*hh,false);
    ctx.globalAlpha=Math.min(1,vI()*(0.5+0.5*level)); ctx.lineWidth=1.5*th; trace(wave,H*0.30*hh,false);
    ctx.globalAlpha=1;
  }

  // ── 💧 Ripples: a glowing horizon line across the middle of the screen.
  //    Every sound makes the WHOLE line emit a ripple — a full-width pair of
  //    lines travelling up and down towards the edges, bouncing back once,
  //    softer — the old expanding circles, straightened out. ──
  function rippleWave(str,c){
    rings.push({off:Math.max(2,canvas.height*0.004),dir:1,
      v:(0.22+0.55*str)*canvas.height*tw('speed'),
      a:vI()*(0.30+0.55*str),c});
  }
  function drawRipples(W,H,dt){
    rippleTimer-=dt;
    if(level>0.02&&rippleTimer<=0){
      rippleTimer=(0.4-0.3*level)/tw('rate');
      rippleWave(level,col.slice());
    }
    if(onset()) rippleWave(Math.min(1,level*1.6),col.slice());  // pop = big wave
    const y0=H/2;
    // the horizon line itself: always faintly there, breathing with the voice;
    // in theme mode it wears the palette as a left-to-right gradient
    const lb=vI()*(0.08+0.45*level+0.015*Math.sin(t*1.7));
    let lineStyle;
    if(SETTINGS.colorMode==='theme'){
      const cols=(THEMES[SETTINGS.theme]||THEMES.prism).colors;
      const g=ctx.createLinearGradient(0,0,W,0);
      cols.forEach((cc,i)=>g.addColorStop(i/(cols.length-1),rgba(cc,1)));
      lineStyle=g;
    } else lineStyle=rgba(col,1);
    ctx.globalAlpha=lb*0.35; ctx.strokeStyle=lineStyle; ctx.lineWidth=Math.max(6,H*0.022);
    ctx.beginPath(); ctx.moveTo(0,y0); ctx.lineTo(W,y0); ctx.stroke();
    ctx.globalAlpha=lb; ctx.lineWidth=Math.max(2,H*0.005);
    ctx.beginPath(); ctx.moveTo(0,y0); ctx.lineTo(W,y0); ctx.stroke();
    ctx.globalAlpha=1;
    rings=rings.filter(gg=>{
      gg.off+=gg.dir*gg.v*dt; gg.a*=Math.pow(0.5,dt);
      if(gg.dir>0&&gg.off>=y0){ gg.dir=-1; gg.off=y0; gg.a*=0.45; }  // one bounce, softer
      if(gg.a<0.015||(gg.dir<0&&gg.off<=0)) return false;
      const lw=Math.max(2,H*0.010)*tw('thick');
      for(let sgn=-1;sgn<=1;sgn+=2){          // mirrored lines above and below
        const y=y0+sgn*gg.off;
        ctx.strokeStyle=rgba(gg.c,gg.a*0.35); ctx.lineWidth=lw*3;    // soft outer
        ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke();
        ctx.strokeStyle=rgba(mix(gg.c,[255,255,255],0.3),gg.a);      // bright core
        ctx.lineWidth=lw;
        ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke();
      }
      return true;
    });
  }

  // ── 🎆 Fireworks: quiet sounds = rising embers across the whole skyline,
  //    sharp sounds = comet bursts that leave a lingering glow in the sky ──
  function drawFireworks(W,H,dt){
    const q=activeQuality(), cap=q==='high'?450:q==='med'?280:140;
    // afterglow: bursts stain the sky, slowly fading (build-up)
    glowPatches=glowPatches.filter(p=>{
      p.life-=dt/8;
      if(p.life<=0) return false;
      glowDisc(p.x,p.y,p.R,p.c,vI()*p.life*0.10);
      return true;
    });
    emitAcc+=dt*level*55*tw('embers');
    while(emitAcc>=1&&parts.length<cap){
      emitAcc--;
      parts.push({x:W*Math.random(),y:H*0.98,
        vx:(Math.random()-0.5)*W*0.06,
        vy:-(0.18+0.45*level)*H*(0.7+Math.random()*0.5),
        size:(1+Math.random()*2)*(H/800),c:col.slice(),life:1,trail:false,px:0,py:0});
    }
    emitAcc=Math.min(emitAcc,3);
    if(onset()&&parts.length<cap-30){
      const bx=W*(0.15+0.7*Math.random()), by=voiceY(H);
      const gCap=buCap(0,4,10);
      if(gCap){ glowPatches.push({x:bx,y:by,R:Math.min(W,H)*(0.15+0.2*level),c:col.slice(),life:1});
        while(glowPatches.length>gCap) glowPatches.shift(); }
      const n=Math.min(cap-parts.length,((24+level*56)*tw('burst'))|0);
      const sp=(0.22+0.5*level)*Math.min(W,H)*Math.sqrt(tw('burst'));
      for(let i=0;i<n;i++){
        const a=Math.random()*Math.PI*2, s=sp*(0.3+0.7*Math.random());
        const c=SETTINGS.colorMode==='theme'?palAt(Math.random()):mix(col,[255,255,255],Math.random()*0.4);
        parts.push({x:bx,y:by,vx:Math.cos(a)*s,vy:Math.sin(a)*s,
          size:(1.2+Math.random()*2.2)*(H/800),c,life:1+Math.random()*0.4,trail:true,px:bx,py:by});
      }
    }
    parts=parts.filter(p=>{
      p.px=p.x; p.py=p.y;
      const drag=p.trail?Math.pow(0.30,dt):1;
      p.vx*=drag; p.vy=p.vy*drag+(p.trail?H*0.28:H*0.05)*dt*tw('fall');
      p.x+=p.vx*dt; p.y+=p.vy*dt; p.life-=dt*(p.trail?0.8:0.45);
      if(p.life<=0||p.y>H+30) return false;
      const a=Math.min(1,p.life)*0.85;
      if(p.trail){
        ctx.strokeStyle=rgba(p.c,a); ctx.lineWidth=p.size; ctx.lineCap='round';
        ctx.beginPath(); ctx.moveTo(p.px,p.py); ctx.lineTo(p.x,p.y); ctx.stroke();
      } else {
        ctx.fillStyle=rgba(p.c,a);
        ctx.beginPath(); ctx.arc(p.x,p.y,p.size,0,Math.PI*2); ctx.fill();
      }
      return true;
    });
  }

  // ── ⭐ Starfield: calm twinkling sky; the voice lights a band of stars at its
  //    pitch height, sharp sounds send a shooting star ──
  function starCount(){
    const q=activeQuality();
    return Math.round((q==='high'?140:q==='med'?90:55)*tw('count'));
  }
  function buildStars(W,H){
    const n=starCount();
    stars=[]; haze=[];
    for(let i=0;i<n;i++)
      stars.push({x:Math.random()*W,y:Math.random()*H,
        r:(0.6+Math.random()*1.6)*(H/800),ph:Math.random()*Math.PI*2,sp:0.3+Math.random()*1.2});
    for(let i=0;i<3;i++)   // faint fixed nebula haze behind the sky
      haze.push({x:W*(0.15+0.7*Math.random()),y:H*(0.15+0.7*Math.random()),
        R:Math.min(W,H)*(0.25+0.2*Math.random()),ci:0.15+0.35*i});
  }
  function drawStars(W,H,dt){
    if(stars.length!==starCount()) buildStars(W,H);
    for(const hz of haze)
      glowDisc(hz.x,hz.y,hz.R,SETTINGS.colorMode==='theme'?palAt(hz.ci):col,vI()*0.035);
    const bandY=voiceY(H), bandW=H*0.22*tw('band'), twAmp=0.12*tw('twinkle');
    const star=(s,base,c0)=>{
      const tw=base+twAmp*Math.sin(t*s.sp+s.ph);
      const d=Math.abs(s.y-bandY)/bandW;
      const lit=level*Math.max(0,1-d*d);            // gaussian-ish band at pitch height
      const c=lit>0.02?mix(c0,col,Math.min(1,lit*1.5)):c0;
      const a=Math.min(1,vI()*(tw+lit*0.9));
      const r=s.r*(1+lit*1.6);
      ctx.fillStyle=rgba(c,a);
      ctx.beginPath(); ctx.arc(s.x,s.y,r,0,Math.PI*2); ctx.fill();
      if(lit>0.25||(s.mem&&a>0.4)){                  // cross-sparkle on bright stars
        ctx.strokeStyle=rgba(c,a*0.5); ctx.lineWidth=1;
        ctx.beginPath();
        ctx.moveTo(s.x-r*3,s.y); ctx.lineTo(s.x+r*3,s.y);
        ctx.moveTo(s.x,s.y-r*3); ctx.lineTo(s.x,s.y+r*3);
        ctx.stroke();
      }
    };
    for(const s of stars) star(s,0.14,[255,255,255]);
    // memory stars: every sharp sound adds a NEW coloured star — the session
    // literally builds this student's sky
    for(const s of memStars) star(s,0.30,s.c);
    const mCap=buCap(0,14,40), hit=onset();
    if(hit&&mCap){
      memStars.push({x:W*(0.05+0.9*Math.random()),y:voiceY(H)*(0.85+0.2*Math.random()),
        r:(1.2+Math.random()*1.6)*(H/800),ph:Math.random()*Math.PI*2,
        sp:0.3+Math.random()*1.2,c:col.slice(),mem:true});
      while(memStars.length>mCap) memStars.shift();
    }
    if(hit&&shoots.length<3){
      const fromLeft=Math.random()<0.5;
      shoots.push({x:fromLeft?-40:W+40,y:H*(0.08+Math.random()*0.35),
        vx:(fromLeft?1:-1)*W*(0.55+0.4*Math.random()),vy:H*(0.06+0.10*Math.random()),
        life:1,c:col.slice()});
    }
    shoots=shoots.filter(s=>{
      const px=s.x,py=s.y;
      s.x+=s.vx*dt; s.y+=s.vy*dt; s.life-=dt*0.7;
      if(s.life<=0||s.x<-80||s.x>W+80) return false;
      const grad=ctx.createLinearGradient(px-s.vx*0.12,py-s.vy*0.12,s.x,s.y);
      grad.addColorStop(0,rgba(s.c,0)); grad.addColorStop(1,rgba(mix(s.c,[255,255,255],0.6),s.life*0.9));
      ctx.strokeStyle=grad; ctx.lineWidth=Math.max(1.5,H*0.003); ctx.lineCap='round';
      ctx.beginPath(); ctx.moveTo(px-s.vx*0.12,py-s.vy*0.12); ctx.lineTo(s.x,s.y); ctx.stroke();
      return true;
    });
  }

  // ── 🌀 Flow: particles carried along a time-varying vector field (layered
  //    sines standing in for curl noise) — silky weaving trails. Loudness
  //    drives the current's speed and density; pitch steers the whole field. ──
  function flowAng(x,y){
    const s=2.2/Math.min(canvas.width,canvas.height);
    return (Math.sin(y*s*1.3+t*0.35)+Math.cos(x*s*0.9-t*0.25)
          +1.3*Math.sin((x*s*0.5+y*s*0.7)+t*0.15))*1.6+pitch01*2.5;
  }
  function drawFlow(W,H,dt){
    const q=activeQuality();
    const cap=Math.round((q==='high'?550:q==='med'?350:180)*tw('density'));
    emitAcc+=dt*(6+level*cap*0.45);
    while(emitAcc>=1&&flows.length<cap){
      emitAcc--;
      const c=SETTINGS.colorMode==='theme'
        ?palAt(Math.max(0,Math.min(1,tp01+(Math.random()-0.5)*0.3)))
        :col.slice();
      flows.push({x:Math.random()*W,y:Math.random()*H,life:(2+Math.random()*2.5)*tw('length'),c});
    }
    emitAcc=Math.min(emitAcc,4);
    const sp=(0.05+0.18*level)*Math.min(W,H)*tw('speed');
    ctx.lineCap='round'; ctx.lineWidth=1.5;
    flows=flows.filter(p=>{
      const a=flowAng(p.x,p.y), px=p.x, py=p.y;
      p.x+=Math.cos(a)*sp*dt; p.y+=Math.sin(a)*sp*dt;
      p.life-=dt*0.45;
      if(p.life<=0||p.x<-8||p.x>W+8||p.y<-8||p.y>H+8) return false;
      ctx.strokeStyle=rgba(p.c,vI()*Math.min(0.55,p.life*0.25)*(0.35+1.1*level));
      ctx.beginPath(); ctx.moveTo(px,py); ctx.lineTo(p.x,p.y); ctx.stroke();
      return true;
    });
  }

  // ── 🟩 Pixels: the whole screen is a coarse pixel grid (count set by the
  //    "Pixels across" slider) running a heat simulation. The voice is a heat
  //    source — loudness sets intensity, pitch sets height — and heat blooms
  //    outward cell by cell, then cools. In silence the grid idles as a faint
  //    breathing mosaic of the theme; heat slides each cell's colour up the
  //    palette towards the hot end, white-hot at the core. Flat rects — cheap. ──
  function pixCols(){ return Math.max(8,Math.round(30*tw('px'))); }
  function initPix(W,H){
    const cols=pixCols(), s=W/cols, rows=Math.max(2,Math.ceil(H/s));
    pix={W,H,cols,rows,s,heat:new Float32Array(cols*rows),
      tmp:new Float32Array(cols*rows),sx:cols/2,hot:false};
  }
  // Pour heat into the grid around cell (cx,cy) with a soft gaussian edge.
  function pixHeat(cx,cy,rad,amt){
    const P=pix, r2=rad*rad;
    const x0=Math.max(0,(cx-rad)|0), x1=Math.min(P.cols-1,Math.ceil(cx+rad));
    const y0=Math.max(0,(cy-rad)|0), y1=Math.min(P.rows-1,Math.ceil(cy+rad));
    for(let y=y0;y<=y1;y++) for(let x=x0;x<=x1;x++){
      const d2=(x-cx)*(x-cx)+(y-cy)*(y-cy);
      if(d2>r2) continue;
      const i=y*P.cols+x;
      P.heat[i]=Math.min(1.25,P.heat[i]+amt*Math.exp(-d2/(r2*0.35)));
    }
  }
  function drawPixels(W,H,dt){
    if(!pix||pix.W!==W||pix.H!==H||pix.cols!==pixCols()) initPix(W,H);
    const P=pix, C=P.cols, R=P.rows, s=P.s, sc=Math.sqrt(C/30);
    // the source wanders slowly left-right so a session paints the whole screen
    const wx=C*(0.5+0.30*Math.sin(t*0.11)+0.14*Math.sin(t*0.043+2));
    P.sx+=(wx-P.sx)*(1-Math.exp(-dt/1.5));
    if(level>0.02)
      pixHeat(P.sx,voiceY(H)/s,(1.2+3.4*level)*sc,dt*(3+24*level));
    if(onset()) pixHeat(P.sx,voiceY(H)/s,(2.6+2.5*level)*sc,0.55);  // pop = splash
    // diffuse to the four neighbours, then cool (build-up = how long heat lives)
    const heat=P.heat, tmp=P.tmp;
    const k=Math.min(0.42,dt*5.5*tw('spread'));
    const cool=Math.exp(-dt/(buCap(1.0,2.6,6.5)*tw('linger')));
    for(let y=0;y<R;y++) for(let x=0;x<C;x++){
      const i=y*C+x, h=heat[i];
      const nb=heat[i-(x>0?1:0)]+heat[i+(x<C-1?1:0)]+heat[i-(y>0?C:0)]+heat[i+(y<R-1?C:0)];
      let v=(h+k*(nb*0.25-h))*cool-dt*0.012;
      tmp[i]=v>0?v:0;
    }
    P.heat=tmp; P.tmp=heat;
    // render: every cell, every frame — the screen IS the grid
    const themeMode=SETTINGS.colorMode==='theme';
    const gap=Math.max(1,s*0.06), tri=v=>{ v%=2; return v<1?v:2-v; };
    let mx=0;
    for(let y=0;y<R;y++) for(let x=0;x<C;x++){
      const h=tmp[y*C+x]; if(h>mx) mx=h;
      const hv=Math.min(1,h);
      // resting palette position: slow diagonal sweep so silence still shows
      // the full theme as a breathing mosaic
      const g0=tri(x*0.6/(C-1)+y*0.4/(R-1)+t*0.008);
      let c;
      if(themeMode){
        // thermal-camera reading of the theme: as a cell heats up its colour
        // sweeps THROUGH the palette towards the hot end, so every bloom wears
        // the full theme as rings; only overdriven cores flash white below
        const w=Math.pow(hv,0.7);
        c=palAt(g0+(hv-g0)*w);
      } else c=mix(col,[255,255,255],hv*0.55);
      if(h>1) c=mix(c,[255,255,255],Math.min(0.55,(h-1)*2.2));  // white-hot core
      const idle=0.05*(0.75+0.25*Math.sin(t*0.6+(x+y)*0.7));
      ctx.fillStyle=rgba(c,Math.min(1,vI()*(idle+0.92*Math.pow(hv,0.9))));
      ctx.fillRect(x*s+gap*0.5,y*s+gap*0.5,s-gap,s-gap);
    }
    P.hot=mx>0.015;
  }

  // ── 💡 LEDs: the sensory-room LED strip, in software. A ring of LEDs around
  //    the screen edge fills like a VU meter and carries a travelling chase;
  //    sharp sounds fire pulses along the strip in both directions. In the
  //    middle, a classic LED-matrix equalizer bounces with the spectrum. ──
  function drawLeds(W,H,dt){
    const m=Math.min(W,H), sp=Math.max(14,(m/32*tw('size'))|0), o=sp*0.7, L=2*(W+H);
    const total=Math.floor(L/sp);
    const pt=s=>{
      s=((s%L)+L)%L;
      if(s<W) return [s,H-o];
      s-=W; if(s<H) return [W-o,H-s];
      s-=H; if(s<W) return [W-s,o];
      s-=W; return [o,s];
    };
    ledChase=(ledChase+dt*L*(0.04+0.35*level)*tw('chase'))%L;
    if(onset()&&ledPulses.length<6){
      ledPulses.push({s:W/2,v:L*0.45,life:1});
      ledPulses.push({s:W/2,v:-L*0.45,life:1});
    }
    ledPulses=ledPulses.filter(p=>{ p.s+=p.v*dt; p.life-=dt*0.8; return p.life>0; });
    const fillArc=level*L/2;                    // VU fill outward from bottom-centre
    const r=sp*0.28;
    for(let k=0;k<total;k++){
      const s=k*sp+sp/2, p=pt(s);
      // distance along the strip from bottom-centre (wrap-aware)
      let d=Math.abs(s-W/2); d=Math.min(d,L-d);
      let b=0.05;                               // idle: the strip itself stays visible
      if(d<fillArc) b+=0.45*(1-d/(fillArc+1));
      let dc=Math.abs(s-ledChase); dc=Math.min(dc,L-dc);
      b+=0.6*Math.max(0,1-dc/(sp*2.5));         // travelling chase hotspot
      for(const pu of ledPulses){
        let dp=Math.abs(s-pu.s); dp=Math.min(dp,L-dp);
        b+=pu.life*Math.max(0,1-dp/(sp*2));
      }
      b=Math.min(1,b)*vI();
      const c=SETTINGS.colorMode==='theme'?palAt(k/(total-1)):col;
      ctx.fillStyle=rgba(c,0.12+0.85*b);
      ctx.beginPath(); ctx.arc(p[0],p[1],r*(1+0.5*b),0,Math.PI*2); ctx.fill();
      if(b>0.5) glowDisc(p[0],p[1],r*4,c,(b-0.5)*0.5);
    }
    // LED-matrix equalizer in the middle
    const NB=16; updateBands(NB,dt);
    const rowsN=12, colW=W*0.72/NB, x0=W*0.14, eh=H*0.42*tw('eq')/rowsN, y0=H*0.72;
    for(let cnum=0;cnum<NB;cnum++){
      const v=bands?bands[cnum]:0, lit=Math.round(Math.pow(v,0.8)*rowsN);
      const c=SETTINGS.colorMode==='theme'?palAt(cnum/(NB-1)):col;
      for(let j=0;j<rowsN;j++){
        const on=j<lit, top=j===lit-1;
        ctx.fillStyle=rgba(top?mix(c,[255,255,255],0.5):c,
          vI()*(on?(top?0.95:0.4+0.3*(j/rowsN)):0.05));
        ctx.beginPath();
        ctx.arc(x0+cnum*colW+colW/2,y0-j*eh,Math.min(colW,eh)*0.26,0,Math.PI*2);
        ctx.fill();
      }
    }
  }

  function drawTouchRings(W,H,dt){
    touchRings=touchRings.filter(g=>{
      g.r+=g.v*dt; g.a*=Math.pow(0.2,dt);
      if(g.a<0.01) return false;
      ctx.strokeStyle=rgba(g.c,g.a);
      ctx.lineWidth=Math.max(2,H*0.006);
      ctx.beginPath(); ctx.arc(g.x,g.y,g.r,0,Math.PI*2); ctx.stroke();
      return true;
    });
  }

  return {
    sectionLabel:'Voice',
    lockMode:'flow',
    noVoices:true,                    // listen-only: touch never makes sound either
    hideRail:['clear'],
    paneLabels:{ instrument:'🎤 Voice', sound:'🔇 Sound' },
    themes:(function(){ const o={};
      for(const k in THEMES) o[k]={label:THEMES[k].label,
        colors:THEMES[k].colors.map(c=>c.map(v=>v/255))};
      return o; })(),
    defaults:{ theme:'prism', sensitivity:'talk', boost:1, visMode:'mandala',
      buildup:'full', visIntensity:1,
      mode:'flow', paint:true, yAxis:'none', colorMode:'theme', showLabels:false },
    schema:[],
    railButtons:[
      { id:'vvmic', icon:()=>micOn()?'🎤':'🎙️',
        title:()=>micOn()?'Microphone is on — tap to turn it off':'Turn the microphone on',
        active:()=>micOn(),
        onClick(){ if(micOn()) disableMic(); else enableMic(); } },
    ],
    // expose read-only internals for automated verification (no UI)
    _dbg(){ return {mic:micState, level:+level.toFixed(3), pitch:+pitch01.toFixed(3),
      meter:+meterLvl.toFixed(3), polls:pollCount, mode:SETTINGS.visMode,
      parts:parts.length, rings:rings.length, stars:stars.length}; },
    // 🎤 Voice tab
    buildInstrument(el){
      const row=document.createElement('div'); row.className='chips';
      const mb=document.createElement('div'); mb.className='chip'+(micOn()?' active':'');
      mb.textContent=micOn()?'🎤 Microphone is ON — tap to turn off':'🎙️ Turn the microphone on';
      mb.addEventListener('click',e=>{ e.stopPropagation(); if(micOn()) disableMic(); else enableMic(); });
      row.appendChild(mb); el.appendChild(row);
      const mh=document.createElement('div'); mh.className='sectn'; mh.textContent='Hearing you now'; el.appendChild(mh);
      const meter=document.createElement('div'); meter.id='vvMeter';
      const fill=document.createElement('div'); fill.id='vvMeterFill'; meter.appendChild(fill);
      el.appendChild(meter);
      el.appendChild(makeChips('Sensitivity (Whisper: tiny sounds → big rewards)','sensitivity',SENS));
      el.appendChild(makeSlider({key:'boost',label:'Extra boost',min:0.5,max:3,step:0.05,dp:2}));
    },
    // 🔇 Sound tab — listen-only by design
    buildSound(el){
      const note=document.createElement('div');
      note.style.cssText='color:rgba(255,255,255,0.65);font:14px/1.6 sans-serif;padding:4px 0 10px';
      note.textContent='Voice Visuals only listens — the microphone is never played through the '+
        'speakers, so there is no feedback howl and nothing to set here. Loudness controls the '+
        'size and brightness of the visuals; the pitch of the voice sets the height and colour.';
      el.appendChild(note);
    },
    // ✨ Visuals tab
    buildVisuals(el){
      el.appendChild(makeChips('Visual style','visMode',VISMODES,()=>{ pokeSim(); buildVisualsPanel(); }));
      el.appendChild(makeChips('Scene build-up (how much stays on screen)','buildup',
        {off:{label:'Just one'},gentle:{label:'Gentle'},full:{label:'Full scene'}},
        buildVisualsPanel));   // rebuild so tweak counts that depend on this stay true
      el.appendChild(makeSlider({key:'visIntensity',label:'Visual intensity',
        min:0.4,max:1.5,step:0.05,dp:2,onChange:pokeSim}));
      // fine-tune sliders for the current style
      const defs=TWEAKS[SETTINGS.visMode];
      if(defs){
        const h=document.createElement('div'); h.className='sectn';
        h.textContent='Fine-tune '+(VISMODES[SETTINGS.visMode]||{}).label; el.appendChild(h);
        defs.forEach(d=>{
          const [p,label,min,max,fmt,step]=d, mode=SETTINGS.visMode;
          const row=document.createElement('div'); row.className='row';
          const head=document.createElement('div'); head.className='rowhead';
          const lab=document.createElement('label'); lab.textContent=label;
          const val=document.createElement('span'); val.className='val';
          const get=()=>{ const o=SETTINGS.tw&&SETTINGS.tw[mode]; const v=o?o[p]:null; return v==null?1:v; };
          const show=()=>{ val.textContent=fmt?fmt(get()):'×'+get().toFixed(2); };
          show();
          head.appendChild(lab); head.appendChild(val);
          const inp=document.createElement('input');
          inp.type='range'; inp.min=min; inp.max=max; inp.step=step||0.05; inp.value=get();
          inp.addEventListener('input',()=>{
            if(!SETTINGS.tw) SETTINGS.tw={};
            if(!SETTINGS.tw[mode]) SETTINGS.tw[mode]={};
            SETTINGS.tw[mode][p]=parseFloat(inp.value);
            show();
            saveSettings(); pokeSim();
          });
          row.appendChild(head); row.appendChild(inp); el.appendChild(row);
        });
        const rc=document.createElement('div'); rc.className='chips';
        const r=document.createElement('div'); r.className='chip'; r.textContent='↺ Reset this style';
        r.addEventListener('click',e=>{ e.stopPropagation();
          if(SETTINGS.tw) delete SETTINGS.tw[SETTINGS.visMode];
          saveSettings(); pokeSim(); buildVisualsPanel(); });
        rc.appendChild(r); el.appendChild(rc);
      }
      el.appendChild(makeChips('Colour','colorMode',
        {theme:{label:'🎨 Theme colours'},note:{label:'🎵 Boomwhacker notes'},single:{label:'⬤ One colour'}},
        buildVisualsPanel));
      if(SETTINGS.colorMode==='theme'){
        const tc=document.createElement('div'); tc.className='chips';
        for(const k in THEMES){
          const c=document.createElement('div'); c.className='chip'+(SETTINGS.theme===k?' active':'');
          c.textContent=THEMES[k].label;
          c.addEventListener('click',e=>{ e.stopPropagation(); setTheme(k); pokeSim(); buildVisualsPanel(); });
          tc.appendChild(c);
        }
        el.appendChild(tc);
      }
      if(SETTINGS.colorMode==='single'){
        const row=document.createElement('div'); row.className='swrow';
        STANDARD_SWATCHES.forEach(c=>{
          const sw=document.createElement('div'); sw.className='swatch'; sw.style.background=rgbCss(c);
          const lk=SETTINGS.lockedColor;
          if(lk) sw.classList.toggle('active',Math.abs(c[0]-lk[0])<0.05&&Math.abs(c[1]-lk[1])<0.05&&Math.abs(c[2]-lk[2])<0.05);
          sw.addEventListener('click',e=>{ e.stopPropagation();
            SETTINGS.lockedColor=c.slice(); saveSettings(); buildVisualsPanel(); });
          row.appendChild(sw);
        });
        el.appendChild(row);
      }
      const bgRow=document.createElement('div'); bgRow.className='swrow';
      const bgpk=document.createElement('label'); bgpk.className='bbar bgpick'; bgpk.title='Background colour';
      bgpk.textContent='Background colour';
      const bgInp=document.createElement('input'); bgInp.type='color'; bgInp.value=SETTINGS.bg;
      bgInp.addEventListener('input',e=>{ e.stopPropagation(); SETTINGS.bg=bgInp.value; saveSettings(); applyBg(); });
      bgpk.addEventListener('click',e=>e.stopPropagation());
      bgpk.appendChild(bgInp); bgRow.appendChild(bgpk); el.appendChild(bgRow);
      el.appendChild(makeChips('Performance','quality',QUALITY,()=>{ if(SETTINGS.quality!=='auto') setPerf(SETTINGS.quality); }));
      el.appendChild(makeToggle('Show performance','showStats',applyStats));
    },
    init(cv){
      ctx=cv.getContext('2d');
      if(!VISMODES[SETTINGS.visMode]) SETTINGS.visMode='mandala';
      if(!document.getElementById('vvGate')){
        const g=document.createElement('div'); g.id='vvGate';
        const b=document.createElement('button');
        b.addEventListener('click',e=>{ e.stopPropagation(); enableMic(); });
        const m=document.createElement('div'); m.className='msg';
        g.appendChild(b); g.appendChild(m); document.body.appendChild(g);
      }
      updateMicUI();
      this.reset();
    },
    resize(w,h){ stars=[]; blobs=[]; this.reset(); },
    // Touch behaves like the voice for the current style (silent, but the same
    // visual language): seed a pixel colony, stir the lava, pour particles…
    // Styles where position has no meaning fall back to a soft touch ring.
    splat(x,y,dx,dy,color){
      const W=canvas.width, H=canvas.height, m=Math.min(W,H);
      const X=x*W, Y=(1-y)*H, mode=SETTINGS.visMode, now=performance.now();
      const c=color.map(v=>Math.min(1,v)*255);
      const act=ms=>{ if(now-lastTouchAct<ms) return false; lastTouchAct=now; return true; };
      if(mode==='lava'){       // stir the lamp: nearby blobs light up and drift away
        for(const b of blobs){
          const d=Math.hypot(b.x-X,b.y-Y);
          if(d<m*0.25){ b.hot=Math.min(1,(b.hot||0)+0.6);
            b.vx+=(b.x-X)/(d+1)*m*0.15; b.vy+=(b.y-Y)/(d+1)*m*0.15; }
        }
        return;
      }
      if(mode==='flow'){       // pour particles into the current under the finger
        for(let i=0;i<5&&flows.length<900;i++)
          flows.push({x:X+(Math.random()-0.5)*m*0.04,y:Y+(Math.random()-0.5)*m*0.04,
            life:(1.5+Math.random()*2)*tw('length'),c:c.slice()});
        return;
      }
      if(mode==='pixels'){     // the finger is a heat source: drag to paint warmth
        if(pix) pixHeat(X/pix.s,Y/pix.s,2.2*Math.sqrt(pix.cols/30),0.4);
        return;
      }
      if(mode==='leds'&&act(250)){   // fire pulses along the strip from the nearest edge
        const dEdge=[Y,H-Y,X,W-X];   // top, bottom, left, right
        const e=dEdge.indexOf(Math.min.apply(null,dEdge));
        const L=2*(W+H);
        const s=e===1?X : e===3?W+(H-Y) : e===0?W+H+(W-X) : W+H+W+Y;
        ledPulses.push({s,v:L*0.45,life:1});
        ledPulses.push({s,v:-L*0.45,life:1});
        return;
      }
      if(mode==='ripples'){     // tap the pool: the line sends out a wave
        if(act(150)) rippleWave(0.55,c);
        return;
      }
      if(mode==='fountain'){
        if(act(250)&&parts.length<400){
          const n=18, sp2=m*0.3*Math.sqrt(tw('burst'));
          for(let i=0;i<n;i++){
            const a=Math.random()*Math.PI*2, s=sp2*(0.3+0.7*Math.random());
            parts.push({x:X,y:Y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,
              size:(1.2+Math.random()*2.2)*(H/800),c:c.slice(),
              life:1+Math.random()*0.4,trail:true,px:X,py:Y});
          }
        }
        return;
      }
      if(mode==='stars'){      // touch a spot in the sky and a star is born there
        const mCap=buCap(0,14,40);
        if(mCap&&act(250)){
          memStars.push({x:X,y:Y,r:(1.2+Math.random()*1.6)*(H/800),
            ph:Math.random()*Math.PI*2,sp:0.3+Math.random()*1.2,c:c.slice(),mem:true});
          while(memStars.length>mCap) memStars.shift();
          return;
        }
      }
      // mandala / waves: position carries no meaning — soft ring
      if(touchRings.length>=24) return;
      touchRings.push({x:X,y:Y,r:4,v:0.18*m,a:0.35,c});
    },
    frame(dt){
      analyse(dt);
      if(!ctx) return;
      t+=dt;
      const W=canvas.width,H=canvas.height,mode=SETTINGS.visMode;
      const fade={mandala:0.30,lava:0.12,waves:0.30,flow:0.045,
        pixels:1,leds:0.4,ripples:0.30,fountain:0.10,stars:0.45}[mode]||0.15;
      ctx.globalCompositeOperation='source-over';
      ctx.fillStyle='rgba('+(bgRGB[0]*255|0)+','+(bgRGB[1]*255|0)+','+(bgRGB[2]*255|0)+','+fade+')';
      ctx.fillRect(0,0,W,H);
      ctx.globalCompositeOperation='lighter';
      if(mode==='mandala') drawMandala(W,H,dt);
      else if(mode==='lava') drawLava(W,H,dt);
      else if(mode==='waves') drawWaves(W,H,dt);
      else if(mode==='flow') drawFlow(W,H,dt);
      else if(mode==='pixels') drawPixels(W,H,dt);
      else if(mode==='leds') drawLeds(W,H,dt);
      else if(mode==='ripples') drawRipples(W,H,dt);
      else if(mode==='fountain') drawFireworks(W,H,dt);
      else drawStars(W,H,dt);
      drawTouchRings(W,H,dt);
      ctx.globalCompositeOperation='source-over';
      prevLevel=level;
      // keep a ~20 s animated tail after the last activity, then let the sim
      // sleep (the last frame stays on screen as a calm still)
      if(level>0.01||rings.length||parts.length||shoots.length||touchRings.length||
         flows.length||glowPatches.length||
         (pix&&pix.hot)||ledPulses.length) lastActive=t;
      if(t-lastActive<20) pokeSim();
    },
    reset(){
      if(!ctx) return;
      rings=[]; parts=[]; touchRings=[]; shoots=[]; stars=[]; blobs=[];
      flows=[];
      glowPatches=[]; memStars=[]; haze=[]; wave=null; wave2=null;
      pix=null; ledPulses=[]; ledChase=0;
      ctx.globalCompositeOperation='source-over';
      ctx.fillStyle='rgb('+(bgRGB[0]*255|0)+','+(bgRGB[1]*255|0)+','+(bgRGB[2]*255|0)+')';
      ctx.fillRect(0,0,canvas.width,canvas.height);
    },
  };
})();
/* ===== ANIMATION END ===== */

boot();
</script>
</body>
